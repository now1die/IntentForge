name: Isolated Mini-C execution

on: [push, pull_request]

permissions:
  contents: read

jobs:
  local-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      OPENBLAS_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements.txt
      - name: Test semantics and disabled gateway
        run: python -m pytest -q tests/test_phase45_semantics.py tests/test_phase45_isolation.py
      - name: Launch the non-root local worker
        run: |
          docker build -f deployment/minic.Dockerfile -t intentforge-minic:ci .
          socket_dir=$(mktemp -d "$RUNNER_TEMP/minic.XXXXXX")
          container=$(docker run -d --network none --read-only --cap-drop ALL \
            --security-opt=no-new-privileges --memory 512m --memory-swap 512m --cpus 1 --pids-limit 48 \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=16m,mode=1777 \
            --mount "type=bind,source=$socket_dir,target=/run/minic" --user "$(id -u):$(id -g)" \
            intentforge-minic:ci)
          echo "MINIC_CONTAINER=$container" >> "$GITHUB_ENV"
          socket="$socket_dir/minic.sock"
          for attempt in {1..30}; do
            if curl --fail --silent --max-time 3 --unix-socket "$socket" http://localhost/internal/capability |
                python -c 'import json, sys; sys.exit(json.load(sys.stdin)["status"] != "available")' 2>/dev/null; then
              echo "INTENTFORGE_VM_GATEWAY=isolated-local" >> "$GITHUB_ENV"
              echo "INTENTFORGE_VM_SOCKET=$socket" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 1
          done
          docker logs "$container"
          exit 1
      - run: python -m pytest -q tests/test_phase45_isolation.py
      - run: python -m benchmarks.phase45_isolation
      - run: python -m pytest -q tests/test_phase5_static.py tests/test_phase5_behavior.py
      - run: python -m benchmarks.phase5_evaluate --live --check
      - run: python -m pytest -q tests/test_phase55.py
      - run: python -m benchmarks.phase55_evaluate --live --check
      - run: python -m pytest -q tests/test_phase6.py
      - run: python -m benchmarks.phase6_evaluate --live --check
      - run: python -m pytest -q tests/test_phase65.py
      - run: python -m benchmarks.phase65_evaluate --live --check
      - run: python -m pytest -q tests/test_phase7.py
      - run: python -m benchmarks.phase7_evaluate --live --check
      - run: python -m pytest -q tests/test_phase75.py
      - run: python -m benchmarks.phase75_evaluate --live --check
      - name: Install workbench packages
        working-directory: frontend
        timeout-minutes: 4
        run: npm ci
      - name: Install Chromium on the Ubuntu runner
        working-directory: frontend
        timeout-minutes: 4
        run: npx playwright install chromium
      - name: Run the isolated workbench scenarios
        working-directory: frontend
        run: npm test -- phase45.spec.ts phase5.spec.ts phase55.spec.ts phase6.spec.ts phase65.spec.ts phase7.spec.ts phase75.spec.ts
      - name: Remove the local worker
        if: always() && env.MINIC_CONTAINER != ''
        run: docker rm -f "$MINIC_CONTAINER"
