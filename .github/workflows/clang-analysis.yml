name: Clang analysis

on: [push, pull_request]

permissions:
  contents: read

jobs:
  clang:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      INTENTFORGE_CLANG_MODE: isolated
      OPENBLAS_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Provision libclang 19 for the dedicated runner
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libclang1-19 libseccomp2
          dpkg-query -W libclang1-19 libseccomp2
          libclang=$(ldconfig -p | awk '/libclang-19.so.1 / {print $NF; exit}')
          test -f "$libclang"
          echo "INTENTFORGE_LIBCLANG=$libclang" >> "$GITHUB_ENV"
      - run: python -m pip install -r requirements.txt -r requirements-clang.txt
      - run: python -m pytest -q tests/test_clang_backend.py
      - run: python -m benchmarks.clang_analysis --check
      - working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm test -- clang.spec.ts
