name: Clang analysis

on: [push, pull_request]

permissions:
  contents: read

jobs:
  clang:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      INTENTFORGE_CLANG_MODE: isolated
      OPENBLAS_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Extract the pinned libclang into the runner workspace
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location --retry 2 --connect-timeout 10 --max-time 60 \
            'https://azure.archive.ubuntu.com/ubuntu/pool/universe/l/llvm-toolchain-19/libclang1-19_19.1.1-1ubuntu1~24.04.2_amd64.deb' \
            --output intentforge-libclang.deb
          echo 'ca0340e157ab40939d40b88eb17bb14532854df631bd6fa7c6fe538401d2080e  intentforge-libclang.deb' | sha256sum --check
          dpkg-deb --extract intentforge-libclang.deb "$RUNNER_TEMP/intentforge-clang"
          libclang=$(find "$RUNNER_TEMP/intentforge-clang" -type f -name 'libclang-19.so.*' -print -quit)
          test -f "$libclang"
          ldd "$libclang"
          echo "INTENTFORGE_LIBCLANG=$libclang" >> "$GITHUB_ENV"
      - run: python -m pip install -r requirements.txt -r requirements-clang.txt
      - name: Verify isolated worker startup
        run: |
          python - <<'PYCODE'
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          from tempfile import TemporaryDirectory

          worker = Path("clang_backend/worker.py").resolve()
          with TemporaryDirectory() as scratch:
              result = subprocess.run(
                  [sys.executable, "-I", str(worker), os.environ["INTENTFORGE_LIBCLANG"], "probe"],
                  cwd=scratch,
                  env={"PATH": os.defpath, "LC_ALL": "C", "TMPDIR": scratch},
                  timeout=15,
                  check=True,
                  stdout=subprocess.PIPE,
                  text=True,
              )
          print(result.stdout)
          assert json.loads(result.stdout)["status"] == "available"
          PYCODE
      - run: python -m pytest -q tests/test_clang_backend.py
      - run: python -m benchmarks.clang_analysis --check
      - working-directory: frontend
        run: |
          npm ci
          npx playwright install chromium
          npm test -- clang.spec.ts
