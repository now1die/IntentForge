name: Python tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      verify_ollama:
        description: Run live verification on the trusted IntentForge Ollama runner
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m test_suite.run_test_cases
      - run: python -m test_suite.run_keyboard_and_array_regression --verify
      - run: python -m test_suite.stress.run_stress_tests .
  ollama:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.verify_ollama &&
      github.repository == 'now1die/IntentForge' &&
      github.ref_name == github.event.repository.default_branch
    runs-on: [self-hosted, intentforge-ollama]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - run: python -m pip install -r requirements.txt
      - run: python -m scripts.verify_ollama --benchmark --out benchmarks/reports/ollama-live-results.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ollama-live-results
          path: benchmarks/reports/ollama-live-results.json
