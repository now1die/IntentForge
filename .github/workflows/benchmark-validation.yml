name: Benchmark validation

on: [push, pull_request]

permissions:
  contents: read

jobs:
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OPENBLAS_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m benchmarks.review_corpus
      - run: python -m benchmarks.audit_training
      - run: python -m benchmarks.run --no-ollama --check
      - run: python -m benchmarks.phase2_audit
      - run: python -m benchmarks.phase2_evaluate --check
      - run: python -m benchmarks.phase25_audit
      - run: python -m benchmarks.phase25_evaluate --check
      - run: python -m benchmarks.ml_v3_audit
      - run: python -m benchmarks.ml_v3_evaluate --check
      - run: python -m benchmarks.phase35_audit
      - run: python -m benchmarks.phase35_evaluate --check
      - run: python -m benchmarks.phase4_vm --check
      - run: python -m benchmarks.phase45_vm --check
      - run: python -m benchmarks.phase5_taxonomy --check
      - run: python -m benchmarks.phase5_evaluate --check
      - run: python -m benchmarks.phase55_evaluate --check
      - run: python -m benchmarks.phase6_evaluate --check
      - run: python -m benchmarks.phase65_evaluate --check
